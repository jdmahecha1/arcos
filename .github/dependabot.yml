version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ['*']
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check aún no admite TypeScript 7; se actualizará cuando lo haga.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
